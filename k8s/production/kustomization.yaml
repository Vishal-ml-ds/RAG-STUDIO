apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rag-studio

commonLabels:
  app.kubernetes.io/part-of: rag-studio
  app.kubernetes.io/managed-by: kustomize

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - qdrant.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - ingress.yaml

# Note: secret.example.yaml is intentionally NOT listed.
# Create the real Secret out-of-band (see k8s/README.md).

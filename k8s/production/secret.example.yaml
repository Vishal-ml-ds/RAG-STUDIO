# ---------------------------------------------------------------
# TEMPLATE - do not apply this file as-is.
# Copy to a local secret.yaml (gitignored), fill in real values,
# then create with:
#   kubectl apply -f secret.yaml -n rag-studio
# Or generate from .env:
#   kubectl create secret generic ragstudio-secrets \
#     -n rag-studio --from-env-file=.env
# ---------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: ragstudio-secrets
  namespace: rag-studio
  labels:
    app.kubernetes.io/part-of: rag-studio
type: Opaque
stringData:
  # Postgres
  POSTGRES_USER:     "REPLACE-ME"
  POSTGRES_PASSWORD: "REPLACE-ME"
  POSTGRES_DB:       "ragstudio"
  DATABASE_URL:      "postgresql+asyncpg://REPLACE-ME:REPLACE-ME@postgres.rag-studio.svc.cluster.local:5432/ragstudio"

  # Redis
  REDIS_PASSWORD: "REPLACE-ME"
  REDIS_URL:      "redis://:REPLACE-ME@redis.rag-studio.svc.cluster.local:6379/0"

  # App
  SECRET_KEY: "REPLACE-ME"
  AUTH_BOOTSTRAP_USERS: "admin@ragstudio.local:REPLACE-ME:admin:00000000-0000-4000-8000-000000000001"

  # LLM providers - leave blank if unused
  OPENAI_API_KEY:    "REPLACE-ME"
  ANTHROPIC_API_KEY: "REPLACE-ME"
  COHERE_API_KEY:    ""
  GOOGLE_API_KEY:    ""
  MISTRAL_API_KEY:   ""

  # Object storage
  MINIO_ACCESS_KEY: "REPLACE-ME"
  MINIO_SECRET_KEY: "REPLACE-ME"

apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: rag-studio
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: rag-studio
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: rag-studio
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: rag-studio
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: rag-studio
    spec:
      containers:
        - name: api
          image: ghcr.io/vishal-ml-ds/rag-studio/api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ragstudio-config
            - secretRef:
                name: ragstudio-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            # Size per environment - these are baselines.
            requests:
              cpu:    "250m"
              memory: "512Mi"
            limits:
              cpu:    "2"
              memory: "2Gi"
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: rag-studio
  labels:
    app.kubernetes.io/part-of: rag-studio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

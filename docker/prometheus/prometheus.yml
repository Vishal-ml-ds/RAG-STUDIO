global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    service: rag-studio

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          component: backend

  # Optional - enable when a node_exporter sidecar is deployed.
  - job_name: node-exporter
    scrape_interval: 30s
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          component: host

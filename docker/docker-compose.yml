# ---------------------------------------------------------------
# RAG Studio - base compose (production shape, image-only)
# Pair with overlays:
#   build:         docker-compose.build.yml
#   dev:           docker-compose.dev.yml
#   prod:          docker-compose.prod.yml
#   observability: docker-compose.observability.yml
# Resources are tuned per environment via the prod overlay.
# ---------------------------------------------------------------

name: ragstudio

networks:
  ragstudio:
    name: ragstudio
    driver: bridge

volumes:
  postgres_data:
    name: ragstudio_postgres_data
  redis_data:
    name: ragstudio_redis_data
  qdrant_data:
    name: ragstudio_qdrant_data
  mlflow_data:
    name: ragstudio_mlflow_data
  minio_data:
    name: ragstudio_minio_data

services:
  # -------------------------------------------------------------
  # PostgreSQL - primary application database
  # -------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: ragstudio-db
    networks: [ragstudio]
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-raguser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragpass}
      POSTGRES_DB:       ${POSTGRES_DB:-ragstudio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-raguser} -d ${POSTGRES_DB:-ragstudio}"]
      interval: 10s
      timeout:  5s
      retries:  5

  # -------------------------------------------------------------
  # Redis - cache + Celery broker/result backend
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: ragstudio-redis
    networks: [ragstudio]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-changeme}
      - --appendonly
      - "yes"
    volumes:
      - redis_data:/data
    healthcheck:
      test:     ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5

  # -------------------------------------------------------------
  # Qdrant - vector database
  # -------------------------------------------------------------
  vector-db:
    image: qdrant/qdrant:v1.9.1
    container_name: ragstudio-qdrant
    networks: [ragstudio]
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:     ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333; echo -e \"GET /readyz HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; head -n 1 <&3 | grep -q 200'"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  # -------------------------------------------------------------
  # MLflow - experiment tracking for autopilot runs
  # -------------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    container_name: ragstudio-mlflow
    networks: [ragstudio]
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --default-artifact-root
      - /mlflow/artifacts
    volumes:
      - mlflow_data:/mlflow
    healthcheck:
      test:     ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health',timeout=3).status==200 else 1)\""]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s

  # -------------------------------------------------------------
  # MinIO - S3-compatible object storage for documents/artifacts
  # -------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: ragstudio-minio
    networks: [ragstudio]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER:     ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout:  5s
      retries:  5
      start_period: 15s

  # -------------------------------------------------------------
  # API - FastAPI application
  # -------------------------------------------------------------
  api:
    image: ghcr.io/${GITHUB_REPOSITORY:-Vishal-ml-ds/RAG-STUDIO}/api:${IMAGE_TAG:-latest}
    container_name: ragstudio-api
    networks: [ragstudio]
    env_file: ../.env
    environment:
      DATABASE_URL:         postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-ragstudio}
      REDIS_URL:            redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      QDRANT_URL:           http://vector-db:6333
      MLFLOW_TRACKING_URI:  http://mlflow:5000
      MINIO_ENDPOINT:       http://minio:9000
    depends_on:
      db:         { condition: service_healthy }
      redis:      { condition: service_healthy }
      vector-db:  { condition: service_healthy }
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 30s

  # -------------------------------------------------------------
  # Worker - Celery worker (same image as api)
  # -------------------------------------------------------------
  worker:
    image: ghcr.io/${GITHUB_REPOSITORY:-Vishal-ml-ds/RAG-STUDIO}/api:${IMAGE_TAG:-latest}
    container_name: ragstudio-worker
    networks: [ragstudio]
    env_file: ../.env
    environment:
      DATABASE_URL:         postgresql+asyncpg://${POSTGRES_USER:-raguser}:${POSTGRES_PASSWORD:-ragpass}@db:5432/${POSTGRES_DB:-ragstudio}
      REDIS_URL:            redis://:${REDIS_PASSWORD:-changeme}@redis:6379/0
      QDRANT_URL:           http://vector-db:6333
      MLFLOW_TRACKING_URI:  http://mlflow:5000
      MINIO_ENDPOINT:       http://minio:9000
    command: ["celery", "-A", "app.worker:celery_app", "worker", "-l", "info", "-Q", "default"]
    depends_on:
      db:    { condition: service_healthy }
      redis: { condition: service_healthy }

  # -------------------------------------------------------------
  # Web - Next.js frontend
  # -------------------------------------------------------------
  web:
    image: ghcr.io/${GITHUB_REPOSITORY:-Vishal-ml-ds/RAG-STUDIO}/web:${IMAGE_TAG:-latest}
    container_name: ragstudio-web
    networks: [ragstudio]
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
      NODE_ENV:            production
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test:     ["CMD", "curl", "-fsS", "http://localhost:3000/"]
      interval: 30s
      timeout:  10s
      retries:  5
      start_period: 20s

  # -------------------------------------------------------------
  # Nginx - single public entry point
  # -------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    container_name: ragstudio-nginx
    networks: [ragstudio]
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout:  5s
      retries:  3

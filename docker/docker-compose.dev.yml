# ---------------------------------------------------------------
# Dev overlay - publishes infra ports, hot-reloads source, and
# targets the `development` Docker stage with debugpy enabled.
#
# Usage:
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.build.yml \
#     -f docker/docker-compose.dev.yml \
#     up --build
# ---------------------------------------------------------------

services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  vector-db:
    ports:
      - "6333:6333"   # HTTP
      - "6334:6334"   # gRPC

  mlflow:
    ports:
      - "5000:5000"

  minio:
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
    command: ["uvicorn", "app.main:app", "--reload", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    volumes:
      - ../apps/api:/app
    ports:
      - "8000:8000"   # FastAPI
      - "5678:5678"   # debugpy

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
      target: development
    command: ["celery", "-A", "app.worker:celery_app", "worker", "-l", "info", "-Q", "default"]
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    volumes:
      - ../apps/api:/app

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      target: builder
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV:           development
      NEXT_PUBLIC_API_URL: http://localhost:8000
    volumes:
      - ../apps/web:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

# ---------------------------------------------------------------
# Observability overlay - Prometheus + Grafana with file-based
# provisioning. Stack joins the shared `ragstudio` network so it
# can scrape api:8000.
#
# Usage:
#   docker compose \
#     -f docker/docker-compose.yml \
#     -f docker/docker-compose.observability.yml \
#     up -d
# ---------------------------------------------------------------

volumes:
  prometheus_data:
    name: ragstudio_prometheus_data
  grafana_data:
    name: ragstudio_grafana_data

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ragstudio-prometheus
    networks: [ragstudio]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test:     ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout:  5s
      retries:  5

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ragstudio-grafana
    networks: [ragstudio]
    environment:
      GF_SERVER_HTTP_PORT:         ${GF_SERVER_HTTP_PORT:-3100}
      GF_SECURITY_ADMIN_USER:      ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD:  ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP:      "false"
      GF_AUTH_ANONYMOUS_ENABLED:   "false"
    ports:
      - "${GF_SERVER_HTTP_PORT:-3100}:${GF_SERVER_HTTP_PORT:-3100}"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test:     ["CMD-SHELL", "wget -qO- http://localhost:${GF_SERVER_HTTP_PORT:-3100}/api/health | grep -q 'ok'"]
      interval: 30s
      timeout:  5s
      retries:  5
